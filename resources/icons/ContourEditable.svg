<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64">
  <g>
    <!-- Contour ouvert avec points éditables -->
    <path
       style="fill:none;stroke:#0078ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"
       d="M 10,50 C 14,20 28,10 34,28 C 40,46 50,14 54,14" />

    <!-- Points de contrôle éditables -->
    <circle cx="10" cy="50" r="4" style="fill:#ff6600;stroke:#cc4400;stroke-width:1.5" />
    <circle cx="34" cy="28" r="4" style="fill:#ff6600;stroke:#cc4400;stroke-width:1.5" />
    <circle cx="54" cy="14" r="4" style="fill:#ff6600;stroke:#cc4400;stroke-width:1.5" />

    <!-- Petits carrés sur les poignées de tangente -->
    <rect x="12" y="18" width="5" height="5" rx="1" style="fill:none;stroke:#ff6600;stroke-width:1.2" />
    <rect x="47" y="42" width="5" height="5" rx="1" style="fill:none;stroke:#ff6600;stroke-width:1.2" />

    <!-- Lignes de tangente (poignées) -->
    <line x1="10" y1="50" x2="14.5" y2="20.5" style="stroke:#ff6600;stroke-width:0.8;stroke-dasharray:2,2" />
    <line x1="54" y1="14" x2="49.5" y2="44.5" style="stroke:#ff6600;stroke-width:0.8;stroke-dasharray:2,2" />

    <!-- Icône crayon en bas à droite -->
    <g transform="translate(44,44) scale(0.8)">
      <path
         style="fill:none;stroke:#444444;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"
         d="M 2,22 L 16,8 L 20,12 L 6,26 Z" />
      <line x1="2" y1="22" x2="6" y2="26" style="stroke:#444444;stroke-width:2;stroke-linecap:round" />
      <line x1="14" y1="10" x2="18" y2="14" style="stroke:#444444;stroke-width:1.5;stroke-linecap:round" />
    </g>
  </g>
</svg>
